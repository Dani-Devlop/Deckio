name: Deploy demo to GitHub Pages

# The full Deckio UI, running on an in-browser demo backend
# (src/lib/demo-backend.ts) — no server required. Every push to main
# rebuilds the static bundle and republishes it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static demo
        env:
          # Project pages serve under /<repo-name>/ — scope asset URLs to it.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
